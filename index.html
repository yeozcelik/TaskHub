<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskHub</title>
<style>
/* ---------- Tasarım tokenları ---------- */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --surface-3:#e6e9ef;
  --border:#dfe3e9; --border-strong:#c8cedb;
  --text:#14161b; --muted:#666e7d; --faint:#8b93a3;
  --accent:#5b5bd6; --accent-soft:#ecebfb; --on-accent:#ffffff;
  --danger:#c92a2a; --danger-soft:#fdecec;
  --warn:#a86100; --warn-soft:#fff4e0;
  --ok:#0b7a55;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --sh-1:0 1px 2px rgba(15,20,35,.06), 0 1px 3px rgba(15,20,35,.05);
  --sh-2:0 8px 30px rgba(15,20,35,.12);
  --sp:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f14; --surface:#161920; --surface-2:#1e222b; --surface-3:#272c37;
    --border:#2a2f3a; --border-strong:#3a4150;
    --text:#e7eaef; --muted:#9aa3b2; --faint:#79818f;
    --accent:#8080f2; --accent-soft:#22224a; --on-accent:#0d0f14;
    --danger:#ff8080; --danger-soft:#3a1e22;
    --warn:#f5c164; --warn-soft:#3a2f18;
    --ok:#4ad9a4;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 8px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f14; --surface:#161920; --surface-2:#1e222b; --surface-3:#272c37;
  --border:#2a2f3a; --border-strong:#3a4150;
  --text:#e7eaef; --muted:#9aa3b2; --faint:#79818f;
  --accent:#8080f2; --accent-soft:#22224a; --on-accent:#0d0f14;
  --danger:#ff8080; --danger-soft:#3a1e22;
  --warn:#f5c164; --warn-soft:#3a2f18;
  --ok:#4ad9a4;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 8px 30px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
::selection{background:var(--accent); color:var(--on-accent)}

/* ---------- Ortak parçalar ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:7px 12px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .13s, border-color .13s, transform .13s;
}
.btn:hover{background:var(--surface-2); border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn-primary:hover{background:var(--accent); filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-icon{padding:7px; width:34px; height:34px}
.btn-danger{color:var(--danger); border-color:var(--border)}
.btn-danger:hover{background:var(--danger-soft); border-color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none;display:block}
.input{
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:8px 11px;
}
.input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
textarea.input{resize:vertical; min-height:78px; line-height:1.55}
.label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:0 0 6px; letter-spacing:.02em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- Üst çubuk ---------- */
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:10px 18px; background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;flex:none}
.brand .mark{
  width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;
}
.brand .mark svg{width:15px;height:15px}
.search{position:relative; flex:1; max-width:420px}
.search .input{padding-left:34px; padding-right:30px}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .ico svg{width:15px;height:15px;display:block}
.spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.sep{width:1px;height:22px;background:var(--border);margin:0 3px}

/* ---------- Düzen ---------- */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); align-items:start}
.sidebar{
  position:sticky; top:53px; align-self:start; max-height:calc(100vh - 53px); overflow-y:auto;
  padding:20px 14px 40px; border-right:1px solid var(--border);
}
.side-group + .side-group{margin-top:22px}
.side-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:0 0 8px 6px}
.side-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.side-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);
}
.side-item:hover{background:var(--surface-2);color:var(--text)}
.side-item[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-item .count{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-item[aria-pressed="true"] .count{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.high{background:var(--danger)} .dot.med{background:var(--warn)} .dot.low{background:var(--faint)}

.main{padding:22px 24px 120px; max-width:840px; margin:0 auto; width:100%}

/* ---------- Bildirim şeritleri ---------- */
.banner{
  display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface-2); margin-bottom:12px; font-size:14px;
}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px}
.banner .grow{flex:1}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
.banner.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.banner .btn{padding:4px 9px;font-size:13px;background:transparent}

/* ---------- Hızlı ekleme ---------- */
.quickadd{display:flex;gap:8px;margin-bottom:20px}
.quickadd .input{
  background:var(--surface); box-shadow:var(--sh-1); border-radius:var(--r); padding:11px 14px;
}

/* ---------- Gruplar ve kartlar ---------- */
.group{margin-bottom:26px}
.group-head{
  display:flex;align-items:center;gap:9px;margin:0 0 9px 2px;
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
}
.group-head .n{
  font-size:11px;color:var(--faint);background:var(--surface-2);border-radius:20px;padding:1px 7px;
  font-variant-numeric:tabular-nums;letter-spacing:0;
}
.group-head.overdue{color:var(--danger)}
.group-toggle{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;display:flex;align-items:center;gap:9px}
.group-toggle svg{width:13px;height:13px;transition:transform .15s}
.group-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}

.tasklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.card{
  display:flex;align-items:flex-start;gap:11px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); padding:11px 12px;
  box-shadow:var(--sh-1); cursor:pointer; transition:border-color .13s, box-shadow .13s, transform .13s;
}
.card:hover{border-color:var(--border-strong); box-shadow:var(--sh-2)}
.card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.card.is-done .card-title{color:var(--faint); text-decoration:line-through}
/* Çubuk yalnızca "Orta"dan sapan öncelikte çizilir — varsayılan her kartı
   boyarsa sinyal olmaktan çıkıp gürültüye dönüşür. */
.card .prio-bar{width:3px;align-self:stretch;border-radius:3px;flex:none;background:transparent;margin:-1px 0}
.card .prio-bar.high{background:var(--danger)}
.card .prio-bar.low{background:var(--border-strong)}
.m-prio.high{color:var(--danger);font-weight:600}
.check{width:18px;height:18px;flex:none;margin-top:2px;cursor:pointer;accent-color:var(--accent)}
.card-body{flex:1;min-width:0}
.card-title{font-weight:500;word-break:break-word}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.card-meta .m{display:inline-flex;align-items:center;gap:4px}
.card-meta svg{width:13px;height:13px}
.due-over{color:var(--danger);font-weight:600}
.due-today{color:var(--accent);font-weight:600}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:12px;color:var(--muted)}
.progress{width:54px;height:4px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.card-del{opacity:0;flex:none;transition:opacity .13s}
.card:hover .card-del,.card:focus-within .card-del{opacity:1}
@media (hover:none){.card-del{opacity:1}}

.empty{text-align:center;padding:64px 20px;color:var(--faint)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:12px}
.empty h2{margin:0 0 6px;font-size:16px;color:var(--muted);font-weight:600}
.empty p{margin:0;font-size:14px}

/* ---------- Yan panel (modal değil) ---------- */
.panel{
  position:fixed;top:0;right:0;height:100%;width:392px;max-width:100%;z-index:40;
  background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--sh-2);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;
  visibility:hidden;
}
.panel.open{transform:none;visibility:visible}
.panel-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.panel-head .ttl{font-weight:600;font-size:13px;color:var(--muted);flex:1}
.panel-body{flex:1;overflow-y:auto;padding:16px 16px 30px}
.field + .field{margin-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel-title-input{font-size:17px;font-weight:600;padding:9px 11px}

.tagbox{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 4px 2px 10px;font-size:12.5px;font-weight:500}
.tag button{border:0;background:none;cursor:pointer;color:inherit;line-height:0;padding:3px;border-radius:50%}
.tag button:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.tag svg{width:11px;height:11px}

.sub-list{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:3px}
.sub{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 2px;border-radius:var(--r-sm)}
.sub:hover{background:var(--surface-2)}
.sub input[type=checkbox]{width:15px;height:15px;flex:none;accent-color:var(--accent);cursor:pointer}
.sub .txt{flex:1;font-size:14px;word-break:break-word}
.sub.done .txt{color:var(--faint);text-decoration:line-through}
.sub .acts{display:flex;gap:1px;opacity:0}
.sub:hover .acts,.sub:focus-within .acts{opacity:1}
.sub .acts button{border:0;background:none;cursor:pointer;color:var(--faint);padding:3px;border-radius:4px;line-height:0}
.sub .acts button:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.sub .acts button:disabled{opacity:.3;cursor:default}
.sub .acts svg{width:13px;height:13px}
.sub-progress{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.sub-progress .progress{flex:1;width:auto}

.panel-foot{padding:11px 14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.panel-foot .btn{white-space:nowrap;flex:none}
.panel-foot .meta{font-size:11.5px;color:var(--faint);margin-left:auto;text-align:right;line-height:1.4}
.panel-foot .meta span{display:block}

.done-toggle{display:flex;align-items:center;gap:9px;margin-top:9px;cursor:pointer;font-size:14px;color:var(--muted);width:fit-content}
.done-toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---------- Toast ---------- */
.toasts{position:fixed;left:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-strong);
  box-shadow:var(--sh-2);border-radius:var(--r);padding:10px 12px;font-size:14px;
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.toast .btn{padding:4px 10px;font-size:13px}

/* ---------- Dialog ---------- */
dialog{
  border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);color:var(--text);
  padding:0;box-shadow:var(--sh-2);max-width:min(440px,92vw);
}
dialog::backdrop{background:rgba(10,12,18,.5)}
dialog:not([open]){display:none}
dialog.dlg-fallback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;display:block}
.dlg-body{padding:20px}
.dlg-body h2{margin:0 0 8px;font-size:16px}
.dlg-body p{margin:0;color:var(--muted);font-size:14px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border);flex-wrap:wrap}

/* ---------- Duyarlı ---------- */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:static;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--border);
    padding:12px 16px;display:flex;gap:18px;overflow-x:auto;
  }
  .side-group+.side-group{margin-top:0}
  .side-group{flex:none}
  .side-list{flex-direction:row;gap:6px}
  .side-item{white-space:nowrap}
  .main{padding:18px 16px 120px}
}
@media (max-width:560px){
  .topbar{flex-wrap:wrap;padding:9px 12px}
  .search{order:3;max-width:none;flex-basis:100%}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- Yazdırma ---------- */
@media print{
  .topbar,.sidebar,.panel,.toasts,.quickadd,.card-del,.check,.banner,.group-toggle svg{display:none !important}
  body{background:#fff;color:#000}
  .app{display:block}
  .main{max-width:none;padding:0}
  .card{break-inside:avoid;box-shadow:none;border-color:#bbb;cursor:default}
  .group-head{color:#000}
}

/* ---------- Görünüm sekmeleri ---------- */
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;flex:none}
.tab{display:inline-flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;color:var(--muted);padding:5px 12px;border-radius:5px;font-weight:500}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.tab svg{width:15px;height:15px}

/* ---------- Depolama göstergesi ---------- */
.meter{margin-top:22px;padding:9px 8px 0;border-top:1px solid var(--border)}
.meter .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:5px;font-variant-numeric:tabular-nums}
.meter .bar{height:4px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.meter .bar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.meter.warn .bar > i{background:var(--warn)} .meter.warn .lbl{color:var(--warn)}
.meter.full .bar > i{background:var(--danger)} .meter.full .lbl{color:var(--danger)}

/* ---------- Notlar düzeni ---------- */
.notes-shell{display:flex;flex-direction:column;height:calc(100vh - 53px)}
.notes-shell > #banners:not(:empty){padding:12px 18px 0}
.notes-app{display:grid;grid-template-columns:212px 260px minmax(0,1fr);align-items:start;flex:1;min-height:0}
.nb-pane,.pg-pane{height:100%;overflow-y:auto;border-right:1px solid var(--border);padding:16px 12px 30px}
.pane-head{display:flex;align-items:center;gap:6px;margin:0 0 9px 6px}
.pane-head h2{flex:1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:0}
.pane-head .btn-icon{width:26px;height:26px;padding:5px}

.nb-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted)}
.nb-item:hover{background:var(--surface-2);color:var(--text)}
.nb-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nb-item .nb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-item .count{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.nb-item[aria-current="true"] .count{color:var(--accent)}
.nb-acts{display:flex;gap:1px;opacity:0}
.nb-row:hover .nb-acts,.nb-row:focus-within .nb-acts{opacity:1}
.nb-row{display:flex;align-items:center;gap:2px;border-radius:var(--r-sm)}
.nb-acts button{border:0;background:none;cursor:pointer;color:var(--faint);padding:4px;border-radius:4px;line-height:0}
.nb-acts button:hover{background:var(--surface-3);color:var(--text)}
.nb-acts svg{width:13px;height:13px}

.pg-item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--text)}
.pg-item:hover{background:var(--surface-2)}
.pg-item[aria-current="true"]{background:var(--surface);border-color:var(--accent);box-shadow:var(--sh-1)}
.pg-item .pg-title{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-item .pg-prev{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;overflow:hidden}
.pg-item .pg-date{font-size:11px;color:var(--faint);margin-top:5px}
.pg-list{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.pg-row{position:relative}
.pg-acts{position:absolute;top:5px;right:5px;opacity:0;transition:opacity .12s}
.pg-row:hover .pg-acts,.pg-row:focus-within .pg-acts{opacity:1}
.pg-acts button{border:0;background:var(--surface);cursor:pointer;color:var(--faint);padding:5px;border-radius:5px;line-height:0;box-shadow:var(--sh-1)}
.pg-acts button:hover{background:var(--danger-soft);color:var(--danger)}
.pg-acts svg{width:13px;height:13px}
.pg-acts button:disabled{opacity:.35;cursor:default}
.pg-row[draggable="true"]{cursor:grab}
.pg-row.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.pg-row.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
@media (hover:none){.pg-acts{opacity:1}}

.ed-head{display:flex;align-items:flex-start;gap:6px;padding-right:20px}
.ed-head .ed-title{flex:1}
.ed-head .btn{margin-top:20px;flex:none}

/* Resim boyutlandırma tutamakları — sayfa akışını bozmasın diye body'ye
   sabit konumla takılır, kaydırma ve pencere boyutunda yeniden konumlanır. */
.img-handles{position:fixed;z-index:70;pointer-events:none;outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.img-handles .h{
  position:absolute;width:12px;height:12px;background:var(--accent);border:2px solid var(--surface);
  border-radius:3px;pointer-events:auto;touch-action:none;
}
.img-handles .h-nw{left:-7px;top:-7px;cursor:nwse-resize}
.img-handles .h-ne{right:-7px;top:-7px;cursor:nesw-resize}
.img-handles .h-sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.img-handles .h-se{right:-7px;bottom:-7px;cursor:nwse-resize}
.img-pop{flex-wrap:wrap;max-width:min(92vw,340px)}

/* ---------- Editör ---------- */
.ed-pane{height:100%;display:flex;flex-direction:column;min-width:0}
.ed-title{border:0;background:none;font-size:26px;font-weight:700;letter-spacing:-.02em;padding:18px 28px 6px;width:100%;color:var(--text)}
.ed-title:focus{outline:none}
.ed-title::placeholder{color:var(--faint)}
.ed-meta{padding:0 28px 10px;font-size:12px;color:var(--faint)}
.toolbar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:6px 24px;border-block:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;z-index:5}
.toolbar button{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:5px;line-height:0;min-width:30px;display:inline-flex;align-items:center;justify-content:center}
.toolbar button:hover{background:var(--surface-3);color:var(--text)}
.toolbar button.on{background:var(--accent-soft);color:var(--accent)}
.toolbar button svg{width:15px;height:15px}
.toolbar .tb-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.toolbar .tb-txt{font-size:13px;font-weight:700;min-width:26px}
.tb-hl{width:15px;height:15px;border-radius:4px;border:1px solid var(--border-strong)}
.tb-hl-none{
  background:var(--surface);position:relative;overflow:hidden;
  background-image:linear-gradient(to top left,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%);
}

.editor{
  flex:1;overflow-y:auto;padding:20px 28px 120px;outline:none;line-height:1.65;
  font-size:15.5px;caret-color:var(--accent);
}
.editor:focus{outline:none}
.editor > *:first-child{margin-top:0}
.editor h1{font-size:23px;margin:22px 0 8px;font-weight:700;letter-spacing:-.01em}
.editor h2{font-size:19px;margin:20px 0 7px;font-weight:700}
.editor h3{font-size:16px;margin:17px 0 6px;font-weight:700;color:var(--muted)}
.editor p{margin:0 0 10px}
.editor ul,.editor ol{margin:0 0 10px;padding-left:26px}
.editor li{margin:3px 0}
.editor blockquote{margin:0 0 10px;padding:2px 0 2px 14px;border-left:3px solid var(--border-strong);color:var(--muted)}
.editor code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.editor pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;overflow-x:auto;margin:0 0 10px}
.editor pre code{background:none;border:0;padding:0}
.editor a{color:var(--accent)}
.editor hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.editor img{max-width:100%;height:auto;border-radius:var(--r-sm);margin:4px 0;cursor:pointer}
.editor img.img-sm{max-width:220px} .editor img.img-md{max-width:460px}
.editor img.sel{outline:2px solid var(--accent);outline-offset:2px}
.editor .hl-y{background:#fde68a;color:#3a2f05;border-radius:3px;padding:0 2px}
.editor .hl-g{background:#bbf7d0;color:#05321d;border-radius:3px;padding:0 2px}
.editor .hl-b{background:#bfdbfe;color:#0a2540;border-radius:3px;padding:0 2px}
.editor .hl-p{background:#f5d0fe;color:#3b0a3e;border-radius:3px;padding:0 2px}
.editor table{border-collapse:collapse;margin:0 0 12px;font-size:.95em;max-width:100%}
.editor .tbl-wrap{overflow-x:auto;margin:0 0 12px}
.editor th,.editor td{border:1px solid var(--border-strong);padding:6px 9px;vertical-align:top;min-width:52px}
.editor th{background:var(--surface-2);font-weight:700;text-align:left}
.editor caption{caption-side:top;text-align:left;color:var(--muted);font-size:.9em;padding-bottom:4px}
.editor .fs-xs{font-size:.78em} .editor .fs-s{font-size:.9em}
.editor .fs-l{font-size:1.3em} .editor .fs-xl{font-size:1.7em}
.editor .note-link{
  color:var(--accent);border-bottom:1px dashed var(--accent);cursor:pointer;
  text-decoration:none;padding-bottom:1px;
}
.editor .note-link::after{content:" ↗";font-size:.8em;vertical-align:super}
.editor .note-link.dead{color:var(--faint);border-bottom-color:var(--faint)}
/* Notlardaki yapılacak maddesi: contenteditable içine gerçek <input> koymak
   imleç ve seçim davranışını bozduğu için işaretleyici CSS ile çizilir. */
.editor ul li.todo{list-style:none;position:relative;padding-left:4px}
.editor ul li.todo::before{
  content:"";position:absolute;left:-22px;top:.28em;width:14px;height:14px;
  border:1.7px solid var(--border-strong);border-radius:4px;background:var(--surface);cursor:pointer;
}
.editor ul li.todo.done::before{
  background:var(--accent);border-color:var(--accent);
  content:"✓";color:var(--on-accent);font-size:11px;line-height:12px;text-align:center;font-weight:700;
}
.editor ul li.todo.done{color:var(--faint);text-decoration:line-through}

.ed-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);padding:40px}
.ed-empty svg{width:38px;height:38px;opacity:.5;margin-bottom:12px}

@media (max-width:1040px){
  .notes-app{grid-template-columns:180px 220px minmax(0,1fr)}
  .editor,.ed-title,.ed-meta{padding-left:20px;padding-right:20px}
  .toolbar{padding-inline:16px}
}
@media (max-width:860px){
  .notes-app{grid-template-columns:minmax(0,1fr);height:auto}
  .nb-pane,.pg-pane{height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--border);padding:12px 16px}
  .nb-pane .nb-row{display:inline-flex}
  .ed-pane{height:auto;min-height:60vh}
}

@media print{
  .tabs,.nb-pane,.pg-pane,.toolbar,.meter,.ed-meta{display:none !important}
  .notes-app{display:block;height:auto}
  .ed-pane{height:auto;display:block}
  .editor{overflow:visible;padding:0;height:auto}
  .ed-title{padding:0 0 12px;font-size:22px}
}

/* ---------- Açılış hatası ---------- */
.bootfail{
  max-width:640px;margin:60px auto;padding:22px 24px;
  border:1px solid #c92a2a;border-left:5px solid #c92a2a;border-radius:10px;
  background:#fdecec;color:#3a1113;
}
.bootfail h1{margin:0 0 10px;font-size:19px}
.bootfail p{margin:0 0 9px;line-height:1.55}
.bootfail-detail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#7a3b3b;word-break:break-word}

/* ---------- Araç çubuğu açılır kutuları ---------- */
.tb-menu{
  position:fixed;z-index:72;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r);box-shadow:var(--sh-2);padding:10px;max-width:250px;
}
.tb-menu-lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
.tb-menu-sep{height:1px;background:var(--border);margin:9px 0}
.tb-menu-row{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:8px;cursor:pointer}
.tb-menu-ops{display:flex;flex-wrap:wrap;gap:4px}
.tb-menu-ops .btn{padding:4px 8px;font-size:12.5px}
.tb-grid{display:grid;grid-template-columns:repeat(10,16px);gap:2px}
.tb-grid .gc{width:16px;height:16px;border:1px solid var(--border);border-radius:2px;background:var(--surface-2);cursor:pointer}
.tb-grid .gc.on{background:var(--accent);border-color:var(--accent)}
.tb-colors{display:grid;grid-template-columns:repeat(8,20px);gap:5px}
.tb-colors .cs{width:20px;height:20px;border-radius:5px;cursor:pointer;border:1px solid var(--border-strong)}
.tb-colors .cs:hover{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- Test ekranı ---------- */
.testwrap{max-width:820px;margin:40px auto;padding:0 20px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.testwrap h1{font-family:system-ui,sans-serif;font-size:20px;margin:0 0 4px}
.testwrap .sum{font-family:system-ui,sans-serif;margin:0 0 20px;color:var(--muted)}
.testwrap ol{margin:0;padding-left:26px}
.testwrap li{padding:3px 0;border-bottom:1px solid var(--border)}
.tpass{color:var(--ok)} .tfail{color:var(--danger);font-weight:700}
</style>
</head>

<noscript>
  <div class="bootfail">
    <h1>JavaScript kapalı</h1>
    <p>TaskHub çalışmak için JavaScript'e ihtiyaç duyar. Tarayıcı ayarlarından etkinleştirip sayfayı yenile.</p>
    <p lang="en">TaskHub needs JavaScript. Enable it in your browser settings and reload.</p>
  </div>
</noscript>
<div id="root"></div>

<!-- Hata tuzağı: bilinçli olarak ES5, kendisi asla patlamasın diye.
     Ana betik ayrıştırma anında ölse bile bu blok çalışmış olur ve
     kullanıcı boş bir sayfa yerine sebebi görür. -->
<script>
(function(){
  var shown = false;
  function report(what, detail){
    if (shown) return; shown = true;
    var box = document.createElement("div");
    box.className = "bootfail";
    var h = document.createElement("h1");
    h.appendChild(document.createTextNode("TaskHub açılamadı"));
    var p1 = document.createElement("p");
    p1.appendChild(document.createTextNode(
      "Tarayıcın bu uygulamayı çalıştıramadı. Genellikle sebebi tarayıcının çok eski olmasıdır — " +
      "güncel bir Firefox veya Chrome ile açmayı dene."));
    var p2 = document.createElement("p");
    p2.className = "bootfail-detail";
    p2.appendChild(document.createTextNode(what + (detail ? ": " + detail : "")));
    var p3 = document.createElement("p");
    p3.className = "bootfail-detail";
    p3.appendChild(document.createTextNode(navigator.userAgent));
    box.appendChild(h); box.appendChild(p1); box.appendChild(p2); box.appendChild(p3);
    var root = document.getElementById("root");
    if (root && root.parentNode) root.parentNode.insertBefore(box, root);
    else if (document.body) document.body.appendChild(box);
  }
  window.addEventListener("error", function(e){
    report(e && e.message ? e.message : "Bilinmeyen hata",
           e && e.filename ? "satır " + e.lineno : "");
  });
  window.addEventListener("unhandledrejection", function(e){
    report("İşlenmeyen hata", e && e.reason ? String(e.reason) : "");
  });
  // Nöbetçi: betik hiç hata vermeden de arayüzü kuramamış olabilir.
  setTimeout(function(){
    var root = document.getElementById("root");
    if (root && !root.firstChild && location.search.indexOf("test=1") === -1){
      report("Arayüz kurulamadı (betik çalışmadı)", "");
    }
  }, 1500);
})();
</script>

function t(key, vars){
  let s = (I18N[state.settings.lang] || I18N.tr)[key];
  if (s === undefined) return key;
  if (vars) for (const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
const LOCALE = () => state.settings.lang === "tr" ? "tr-TR" : "en-GB";

/* ------------------------------------------------------ saf yardımcılar */

/** Arama için harf katlama.
 *  toLocaleLowerCase("tr") KULLANILMAZ: Türkçe locale I→ı, İ→i eşlediği için
 *  "istanbul" araması "İstanbul"u bulamaz. Burada ı/İ/I/i tek havuza indirilir. */
function foldTr(s){
  if (s == null) return "";
  return String(s)
    .replace(/[İIı]/g, "i")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

const pad2 = n => String(n).padStart(2, "0");
/** Date -> "YYYY-MM-DD", yerel saatle. */
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
/** "YYYY-MM-DD" -> yerel gece yarısı Date. Date.parse UTC yorumlar, gün kaydırır. */
function parseYmd(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d;
}
/** b - a, tam gün. Yaz saati geçişlerinde 23/25 saat olabildiği için yuvarlanır. */
function daysBetween(aY, bY){
  const a = parseYmd(aY), b = parseYmd(bY);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}

const BUCKETS = ["overdue","today","tomorrow","week","later","nodate","completed"];
/** Görevin hangi vade grubuna düştüğü. */
function bucketOf(task, todayY){
  if (task.done) return "completed";
  if (!task.dueDate) return "nodate";
  const d = daysBetween(todayY, task.dueDate);
  if (d === null) return "nodate";
  if (d < 0) return "overdue";
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d <= 7) return "week";
  return "later";
}

const CSV_DELIM = ";"; // Türkçe Excel'in beklediği alan ayırıcısı
function csvEscape(v, delim){
  const d = delim || CSV_DELIM;
  const s = v == null ? "" : String(v);
  return /["\r\n]/.test(s) || s.indexOf(d) !== -1 ? '"' + s.replace(/"/g, '""') + '"' : s;
}

const ts = x => { const n = Date.parse(x); return isNaN(n) ? 0 : n; };
/** id çakışmasında updatedAt'i yeni olan kazanır. */
function mergeImport(current, incoming){
  const out = current.slice();
  const idx = new Map(out.map((t, i) => [t.id, i]));
  let added = 0, updated = 0, kept = 0;
  for (const inc of incoming){
    if (!idx.has(inc.id)){ idx.set(inc.id, out.length); out.push(inc); added++; }
    else {
      const i = idx.get(inc.id);
      if (ts(inc.updatedAt) > ts(out[i].updatedAt)){ out[i] = inc; updated++; }
      else kept++;
    }
  }
  return { tasks: out, added, updated, kept };
}

/* ------------------------------------------------- not içeriği süzgeci ---
 * Zengin metin editörü web'den kopyalanan HTML'i olduğu gibi alır. Bu içerik
 * localStorage'a yazılıp sonra innerHTML ile geri basıldığında, kendi dosyanda
 * saklanmış kod çalışır. Bu yüzden süzgeç izin listesiyle çalışır: bilinmeyen
 * her şey reddedilir, kara liste tutulmaz.
 * Hem yapıştırma anında hem yükleme anında geçirilir — elle düzenlenmiş ya da
 * başkasından gelen bir yedek dosyası da aynı içeriği taşıyabilir. */

// İçeriğiyle birlikte tamamen atılanlar.
const DROP_TAGS = {
  SCRIPT:1, STYLE:1, IFRAME:1, OBJECT:1, EMBED:1, FORM:1, INPUT:1, BUTTON:1,
  SELECT:1, TEXTAREA:1, OPTION:1, LINK:1, META:1, BASE:1, TITLE:1, NOSCRIPT:1,
  SVG:1, MATH:1, TEMPLATE:1, AUDIO:1, VIDEO:1, SOURCE:1, CANVAS:1, APPLET:1, FRAME:1, FRAMESET:1
};
// Korunan etiketler. DIV bilerek içeride: contenteditable satır sonlarını
// <div> ile üretir, atılırsa her yeniden yüklemede satırlar birleşir.
const OK_TAGS = {
  P:1, DIV:1, BR:1, H1:1, H2:1, H3:1, B:1, STRONG:1, I:1, EM:1, U:1, S:1, STRIKE:1,
  UL:1, OL:1, LI:1, A:1, CODE:1, PRE:1, BLOCKQUOTE:1, HR:1, MARK:1, SPAN:1, IMG:1,
  TABLE:1, THEAD:1, TBODY:1, TFOOT:1, TR:1, TD:1, TH:1, CAPTION:1
};
const VOID_TAGS = { BR:1, HR:1, IMG:1 };
// class niteliğinde yalnızca bu adlar kalır.
const OK_CLASS = {
  // hl-* eski notlarda kalan vurgu sınıfları; yeni içerik satır içi
  // background-color yazar (tek kanonik temsil). Eskiler okunur kalsın diye durur.
  "hl-y":1, "hl-g":1, "hl-b":1, "hl-p":1,
  "todo":1, "done":1,
  "img-sm":1, "img-md":1, "img-lg":1,
  "note-link":1,
  "fs-xs":1, "fs-s":1, "fs-m":1, "fs-l":1, "fs-xl":1,
  // Kaydedilmezse her yüklemede yeni bir sarmalayıcı eklenip birikirdi.
  "tbl-wrap":1
};
const MAX_DEPTH = 40;

function safeUrl(u){
  const s = String(u == null ? "" : u).replace(/[\u0000-\u001f\u007f]/g, "").trim();
  return /^(https?:\/\/|mailto:)/i.test(s) ? s : null;
}
function safeImgSrc(u){
  const s = String(u == null ? "" : u).replace(/\s/g, "");
  return /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/=]+$/i.test(s) ? s : null;
}

function cleanFragment(src, doc, depth, inTable){
  const frag = doc.createDocumentFragment();
  for (let n = src.firstChild; n; n = n.nextSibling){
    if (n.nodeType === 3){ frag.appendChild(doc.createTextNode(n.nodeValue)); continue; }
    if (n.nodeType !== 1) continue;                       // yorum ve diğerleri düşer
    const tag = n.tagName.toUpperCase();
    if (DROP_TAGS[tag]) continue;
    // İzinsiz ama zararsız etiket (table, font, section…): açılır, metni korunur.
    if (!OK_TAGS[tag] || depth >= MAX_DEPTH){ frag.appendChild(cleanFragment(n, doc, depth + 1, inTable)); continue; }

    const out = doc.createElement(tag);
    const attrs = n.attributes;
    for (let i = 0; i < attrs.length; i++){
      const name = attrs[i].name.toLowerCase(), val = attrs[i].value;
      if (name === "href" && tag === "A"){
        const u = safeUrl(val);
        if (u){ out.setAttribute("href", u); out.setAttribute("rel", "noopener noreferrer"); out.setAttribute("target", "_blank"); }
      } else if (name === "src" && tag === "IMG"){
        const u = safeImgSrc(val);
        if (u) out.setAttribute("src", u);
      } else if (name === "alt" && tag === "IMG"){
        out.setAttribute("alt", val.slice(0, 200));
      } else if (name === "width" && tag === "IMG"){
        // Genişlik satır içi stille değil HTML niteliğiyle saklanır; style süzgeçten geçmiyor.
        const n = parseInt(val, 10);
        if (isFinite(n) && n >= 40 && n <= 1600) out.setAttribute("width", String(n));
      } else if (name === "class"){
        const cls = val.split(/\s+/).filter(c => OK_CLASS[c]);
        if (cls.length) out.setAttribute("class", cls.join(" "));
      } else if (name === "data-task"){
        if (/^[A-Za-z0-9_-]{1,64}$/.test(val)) out.setAttribute("data-task", val);
      } else if (name === "style"){
        // DAR GEÇİT: yalnızca iki özellik ve yalnızca doğrulanmış renk değerleri.
        // Değer YENİDEN ÜRETİLİR; ham stil dizesi hiçbir yoldan geçmez, bu yüzden
        // position/url()/expression() gibi hiçbir şey hayatta kalamaz.
        const decls = parseStyleDecls(val), keep = [];
        const fg = normColor(decls["color"]);
        const bg = normColor(decls["background-color"]);
        if (fg) keep.push("color:" + fg);
        if (bg) keep.push("background-color:" + bg);
        if (keep.length) out.setAttribute("style", keep.join(";"));
      } else if ((name === "colspan" || name === "rowspan") && (tag === "TD" || tag === "TH")){
        const n2 = parseInt(val, 10);
        if (isFinite(n2) && n2 >= 1 && n2 <= 99) out.setAttribute(name, String(n2));
      }
      // Geri kalan her şey — özellikle style ve on* — düşer.
    }
    if (tag === "IMG" && !out.getAttribute("src")) continue;
    if (VOID_TAGS[tag]){ frag.appendChild(out); continue; }
    if (tag === "TABLE" && inTable){
      // İç içe tablo açılır: düzenleme modelini çözümsüz hale getirirdi.
      frag.appendChild(cleanFragment(n, doc, depth + 1, inTable));
      continue;
    }
    // Bağlantı hedefi hayatta kalmadıysa etiketi tutmanın anlamı yok, açılır.
    if (tag === "A" && !out.hasAttribute("href") && !out.hasAttribute("data-task")){
      frag.appendChild(cleanFragment(n, doc, depth + 1, inTable));
      continue;
    }
    out.appendChild(cleanFragment(n, doc, depth + 1, inTable || tag === "TABLE"));
    frag.appendChild(out);
  }
  return frag;
}

/* ============ SUNUM BİÇİMİNİ ANLAMSAL ETİKETE ÇEVİRME (Word/OneNote) ======
 * Word ve OneNote biçimi neredeyse tamamen style="font-weight:700" gibi
 * niteliklerle taşır. Süzgeç style'ı attığı için geriye çıplak metin kalıyordu.
 * Çözüm: ATMADAN ÖNCE niteliğin anlamını okuyup izinli etiketlere çevirmek.
 *
 * Naif "öğeyi <b> ile sar" yaklaşımı iç içe çelişen stillerde bozulur:
 * font-weight:700 içindeki font-weight:400 temsil edilemez. Bu yüzden çeviri
 * ÇALIŞMA TABANLIDIR — her metin parçası için etkin biçim atalardan hesaplanır
 * ve çıktı sıfırdan, sabit bir sırayla üretilir. İdempotentlik bunun sonucudur:
 * f(f(x)) === f(x). */

const CSS_NAMES = {
  black:"#000000", silver:"#c0c0c0", gray:"#808080", grey:"#808080", white:"#ffffff",
  maroon:"#800000", red:"#ff0000", purple:"#800080", fuchsia:"#ff00ff", magenta:"#ff00ff",
  green:"#008000", lime:"#00ff00", olive:"#808000", yellow:"#ffff00", navy:"#000080",
  blue:"#0000ff", teal:"#008080", aqua:"#00ffff", cyan:"#00ffff", orange:"#ffa500",
  windowtext:"#000000"
};
/** Yalnızca hex, rgb() ve temel adlar. rgba/hsl/yüzde/transparent/currentColor
 *  bilerek desteklenmiyor — değer daima #rrggbb olarak YENİDEN ÜRETİLİR, ham
 *  dize hiçbir yoldan geçmez. */
function normColor(v){
  const s = String(v == null ? "" : v).trim().toLowerCase();
  if (!s) return null;
  if (CSS_NAMES[s]) return CSS_NAMES[s];
  let m = /^#([0-9a-f]{3})$/.exec(s);
  if (m) return "#" + m[1].charAt(0) + m[1].charAt(0) + m[1].charAt(1) + m[1].charAt(1) + m[1].charAt(2) + m[1].charAt(2);
  m = /^#([0-9a-f]{6})$/.exec(s);
  if (m) return "#" + m[1];
  m = /^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/.exec(s);
  if (m){
    const h = n => { const x = Math.max(0, Math.min(255, parseInt(n, 10))); return (x < 16 ? "0" : "") + x.toString(16); };
    return "#" + h(m[1]) + h(m[2]) + h(m[3]);
  }
  return null;
}

/* Serbest px saklanmaz, beş kademeye yuvarlanır: sayfa düzenini bozmasın.
   Aralıklar Word'ün gerçek puntolarına göre seçildi — 11pt (=14.67px) Word'ün
   varsayılan gövde puntosudur ve "normal" sayılmalıdır, aksi halde her Word
   belgesi küçük görünürdü. 14pt=18.67 ve 16pt=21.3 başlık sayılır. */
const FS_RANGES = [
  [12.5, "fs-xs"],   // < 12.5px  (≤ 9pt)
  [14.0, "fs-s"],    // 12.5–14   (10pt)
  [18.0, null],      // 14–18     (11pt, 12pt, 13pt → normal)
  [26.0, "fs-l"],    // 18–26     (14pt, 16pt, 18pt)
  [Infinity, "fs-xl"]
];
function normFontSize(v){
  const s = String(v == null ? "" : v).trim().toLowerCase();
  let px = null, m;
  if ((m = /^([\d.]+)\s*pt$/.exec(s))) px = parseFloat(m[1]) * 4 / 3;
  else if ((m = /^([\d.]+)\s*px$/.exec(s))) px = parseFloat(m[1]);
  else if ((m = /^([\d.]+)\s*em$/.exec(s))) px = parseFloat(m[1]) * 16;
  else if ((m = /^([\d.]+)\s*%$/.exec(s))) px = parseFloat(m[1]) / 100 * 16;
  if (px === null || !isFinite(px) || px <= 0) return null;
  for (let i = 0; i < FS_RANGES.length; i++) if (px < FS_RANGES[i][0]) return FS_RANGES[i][1];
  return "fs-xl";
}

function parseStyleDecls(styleStr){
  const out = {};
  String(styleStr == null ? "" : styleStr).split(";").forEach(part => {
    const i = part.indexOf(":");
    if (i < 0) return;
    const k = part.slice(0, i).trim().toLowerCase();
    const v = part.slice(i + 1).replace(/!important/ig, "").trim();
    if (k && v) out[k] = v;
  });
  return out;
}

const EMPTY_STYLE = { b:false, i:false, u:false, s:false, color:null, bg:null, fs:null };

/** Bir öğenin etkin biçime katkısı. Sıfırlayan değerler (normal / 400 / none)
 *  bayrağı KAPATIR — iç içe çelişkinin doğru çözüldüğü yer burası. */
function styleContribution(el, st){
  const n = { b:st.b, i:st.i, u:st.u, s:st.s, color:st.color, bg:st.bg, fs:st.fs };
  const tag = el.tagName.toUpperCase();
  if (tag === "B" || tag === "STRONG") n.b = true;
  if (tag === "I" || tag === "EM") n.i = true;
  if (tag === "U" || tag === "INS") n.u = true;
  if (tag === "S" || tag === "STRIKE" || tag === "DEL") n.s = true;
  if (tag === "MARK" && !n.bg) n.bg = "#fde68a";
  if (tag === "FONT"){
    const c = normColor(el.getAttribute("color"));
    if (c) n.color = c;
    const sz = parseInt(el.getAttribute("size"), 10);
    if (isFinite(sz)) n.fs = normFontSize([10,13,16,18,24,32,48][Math.max(1, Math.min(7, sz)) - 1] + "px");
  }
  // Kendi çıktımızı geri okumak zorundayız, yoksa ikinci geçiş bilgiyi düşürür
  // ve f(f(x)) === f(x) bozulur.
  const ownCls = String(el.className || "");
  const fsm = /(^|\s)(fs-(?:xs|s|m|l|xl))(\s|$)/.exec(ownCls);
  if (fsm) n.fs = fsm[2] === "fs-m" ? null : fsm[2];
  const hlm = /(^|\s)hl-([ygbp])(\s|$)/.exec(ownCls);   // eski notlardaki vurgu sınıfları
  if (hlm) n.bg = { y:"#fde68a", g:"#bbf7d0", b:"#bfdbfe", p:"#f5d0fe" }[hlm[2]];

  const d = parseStyleDecls(el.getAttribute("style"));
  if (d["font-weight"]){
    const w = d["font-weight"].toLowerCase(), num = parseFloat(w);
    if (w === "bold" || w === "bolder" || (isFinite(num) && num >= 600)) n.b = true;
    else if (w === "normal" || w === "lighter" || (isFinite(num) && num < 600)) n.b = false;
  }
  if (d["font-style"]){
    const v = d["font-style"].toLowerCase();
    if (v === "italic" || v === "oblique") n.i = true;
    else if (v === "normal") n.i = false;
  }
  const td = String(d["text-decoration"] || d["text-decoration-line"] || "").toLowerCase();
  if (td){
    if (/\bnone\b/.test(td)){ n.u = false; n.s = false; }
    if (/underline/.test(td)) n.u = true;
    if (/line-through/.test(td)) n.s = true;
  }
  if (d["color"]){ const c = normColor(d["color"]); if (c) n.color = c; }
  const bgRaw = d["background-color"] || d["background"];
  if (bgRaw){ const c = normColor(String(bgRaw).split(/\s+/)[0]); if (c) n.bg = c; }
  if (d["font-size"]) n.fs = normFontSize(d["font-size"]);
  return n;
}

/** Metin parçasını etkin biçimden SIFIRDAN sarar. Sıra sabittir (b > i > u > s
 *  > span), böylece ikinci geçiş aynı çıktıyı üretir. */
function wrapRun(doc, text, st){
  let node = doc.createTextNode(text);
  if (st.color || st.bg || st.fs){
    const span = doc.createElement("span");
    const decls = [];
    if (st.color) decls.push("color:" + st.color);
    if (st.bg) decls.push("background-color:" + st.bg);
    if (decls.length) span.setAttribute("style", decls.join(";"));
    if (st.fs) span.setAttribute("class", st.fs);
    span.appendChild(node);
    node = span;
  }
  const order = [["s","s"],["u","u"],["i","i"],["b","b"]];
  for (let i = 0; i < order.length; i++){
    if (st[order[i][0]]){
      const e = doc.createElement(order[i][1]);
      e.appendChild(node);
      node = e;
    }
  }
  return node;
}

const KEEP_BLOCK = { P:1, DIV:1, H1:1, H2:1, H3:1, UL:1, OL:1, LI:1, BLOCKQUOTE:1, PRE:1,
                     TABLE:1, THEAD:1, TBODY:1, TFOOT:1, TR:1, TD:1, TH:1, CAPTION:1 };
const KEEP_VOID2 = { BR:1, HR:1, IMG:1 };
const KEEP_INLINE = { A:1, CODE:1 };

function copyStructAttrs(src, dst, tag){
  if (tag === "A" && src.getAttribute("href")) dst.setAttribute("href", src.getAttribute("href"));
  if (tag === "IMG"){
    if (src.getAttribute("src")) dst.setAttribute("src", src.getAttribute("src"));
    if (src.getAttribute("alt")) dst.setAttribute("alt", src.getAttribute("alt"));
    if (src.getAttribute("width")) dst.setAttribute("width", src.getAttribute("width"));
  }
  if (tag === "TD" || tag === "TH"){
    ["colspan","rowspan"].forEach(a => { if (src.getAttribute(a)) dst.setAttribute(a, src.getAttribute(a)); });
  }
  // Yalnızca kendi sınıflarımız taşınır; Mso* ve benzeri düşer.
  const cls = String(src.className || "").split(/\s+/).filter(c => OK_CLASS[c]);
  if (cls.length) dst.setAttribute("class", cls.join(" "));
  if (src.hasAttribute && src.hasAttribute("data-task")) dst.setAttribute("data-task", src.getAttribute("data-task"));
}

function rebuildRuns(src, doc, st, depth){
  const frag = doc.createDocumentFragment();
  for (let n = src.firstChild; n; n = n.nextSibling){
    if (n.nodeType === 3){
      if (!n.nodeValue) continue;
      // Yalnızca boşluktan ibaret parçaları sarmalamak <b> </b> gibi artık üretir.
      if (!/\S/.test(n.nodeValue)) frag.appendChild(doc.createTextNode(n.nodeValue));
      else frag.appendChild(wrapRun(doc, n.nodeValue, st));
      continue;
    }
    if (n.nodeType !== 1) continue;
    const tag = n.tagName.toUpperCase();
    if (DROP_TAGS[tag]) continue;
    if (depth > MAX_DEPTH){ frag.appendChild(rebuildRuns(n, doc, st, depth + 1)); continue; }
    if (KEEP_VOID2[tag]){
      const e = doc.createElement(tag);
      copyStructAttrs(n, e, tag);
      frag.appendChild(e);
      continue;
    }
    // Görev bağlantısı (data-task) korunmalı: notlar arasında kopyala-yapıştır
    // yaptığında bağ kopmasın.
    if (n.hasAttribute && n.hasAttribute("data-task")){
      const e = doc.createElement(tag === "A" ? "a" : "span");
      copyStructAttrs(n, e, tag);
      e.setAttribute("data-task", n.getAttribute("data-task"));
      const cls = String(n.className || "");
      if (/note-link/.test(cls)) e.setAttribute("class", "note-link");
      e.appendChild(rebuildRuns(n, doc, styleContribution(n, st), depth + 1));
      frag.appendChild(e);
      continue;
    }
    if (KEEP_BLOCK[tag] || KEEP_INLINE[tag]){
      const e = doc.createElement(tag);
      copyStructAttrs(n, e, tag);
      e.appendChild(rebuildRuns(n, doc, styleContribution(n, st), depth + 1));
      frag.appendChild(e);
      continue;
    }
    // span, font, b, i, u, s, mark, section, o:p … : açılır, biçimi biriktirilir
    frag.appendChild(rebuildRuns(n, doc, styleContribution(n, st), depth + 1));
  }
  return frag;
}

/* ------------------------------------------------ Word listeleri (tek seviye)
 * DESTEKLENEN: tek seviyeli madde işaretli ve ondalık numaralı listeler.
 * DESTEKLENMEYEN ama KAYBOLMAYAN: çok seviyeli (level2+), a./A./i./IV. biçimleri,
 * 1'den farklı başlangıç — bunlar paragraf olarak korunur. */
const WL_BULLET = /^\s*[·•●▪■◦§]\s*/;
const WL_DECIMAL = /^\s*\d{1,3}[.)]\s+/;

function wordListInfo(el){
  const style = String(el.getAttribute("style") || "");
  const cls = String(el.className || "");
  const isWord = /mso-list/i.test(style) || /MsoListParagraph|MsoListBullet|MsoListNumber/i.test(cls);
  const lvl = /level\s*(\d+)/i.exec(style);
  if (isWord && lvl && parseInt(lvl[1], 10) > 1) return null;   // çok seviyeli: paragraf kalsın
  const text = String(el.textContent || "");
  if (WL_DECIMAL.test(text)) return { type:"ol", re: WL_DECIMAL };
  if (WL_BULLET.test(text)) return { type:"ul", re: WL_BULLET };
  if (isWord && /^\s*o\s+\S/.test(text)) return { type:"ul", re: /^\s*o\s+/ };  // Word'ün "o" madde işareti
  if (isWord) return { type:"ul", re: null };
  return null;
}
function firstTextNode(el){
  const w = [el];
  while (w.length){
    const n = w.shift();
    if (n.nodeType === 3 && /\S/.test(n.nodeValue)) return n;
    for (let c = n.firstChild; c; c = c.nextSibling) w.push(c);
  }
  return null;
}
function wordListPass(doc){
  // Word işaretçiyi ayrı bir kapta taşır. Çok seviyeli maddeleri listeye
  // ÇEVİRMİYORUZ ama işaretçi kabını yine de atmalıyız; yoksa paragrafın
  // başında yazım hatası gibi duran bir "o" ya da "·" kalır.
  const markers = doc.body.querySelectorAll('span[style*="mso-list"]');
  for (let m = 0; m < markers.length; m++){
    const el = markers[m];
    if (/ignore/i.test(el.getAttribute("style") || "") && el.parentNode) el.parentNode.removeChild(el);
  }
  const blocks = [].slice.call(doc.body.querySelectorAll("p,div"));
  let i = 0;
  while (i < blocks.length){
    const info = wordListInfo(blocks[i]);
    if (!info){ i++; continue; }
    const group = [blocks[i]];
    let j = i + 1;
    while (j < blocks.length){
      const inf2 = wordListInfo(blocks[j]);
      if (!inf2 || inf2.type !== info.type) break;
      if (blocks[j].parentNode !== blocks[j - 1].parentNode) break;
      if (blocks[j].previousElementSibling !== blocks[j - 1]) break;  // araya normal paragraf girdiyse kes
      group.push(blocks[j]); j++;
    }
    const list = doc.createElement(info.type);
    for (let k = 0; k < group.length; k++){
      const p = group[k];
      if (info.re){
        const tn = firstTextNode(p);
        if (tn) tn.nodeValue = tn.nodeValue.replace(info.re, "");
      }
      const li = doc.createElement("li");
      while (p.firstChild) li.appendChild(p.firstChild);
      list.appendChild(li);
    }
    group[0].parentNode.insertBefore(list, group[0]);
    for (let k = 0; k < group.length; k++) if (group[k].parentNode) group[k].parentNode.removeChild(group[k]);
    i = j;
  }
}

function presentationalToSemantic(html){
  let doc;
  try { doc = scratchDoc(html); } catch(e){ return String(html == null ? "" : html); }
  try { wordListPass(doc); } catch(e){ /* liste sezimi başarısızsa içerik yine gelsin */ }
  const out = document.implementation.createHTMLDocument("");
  out.body.appendChild(rebuildRuns(doc.body, out, EMPTY_STYLE, 0));
  return out.body.innerHTML;
}

/** Canlı belgeye hiç değmeden ayrıştırır: createHTMLDocument'in tarama bağlamı
 *  olmadığı için ayrıştırma sırasında script çalışmaz, resim yüklenmez. */
function scratchDoc(html){
  const doc = document.implementation.createHTMLDocument("");
  doc.body.innerHTML = String(html == null ? "" : html);
  return doc;
}

function sanitizeHtml(html){
  let doc;
  try { doc = scratchDoc(html); } catch(e){ return ""; }
  const out = document.implementation.createHTMLDocument("");
  out.body.appendChild(cleanFragment(doc.body, out, 0, false));
  return out.body.innerHTML;
}

/** Biçimli içerikten düz metin — arama ve önizleme için.
 *  textContent blok sınırlarını yok sayar ve "…maddeleriBu satır…" gibi
 *  yapışık çıktı verir; bu hem önizlemeyi okunmaz yapar hem de bloklar arası
 *  geçen bir arama ifadesinin eşleşmesini engeller. Bloklardan sonra boşluk
 *  eklenir. */
const BLOCK_SEL = "p,div,h1,h2,h3,li,blockquote,pre,br,hr,tr,td";
function noteText(html){
  let doc;
  try { doc = scratchDoc(html); } catch(e){ return ""; }
  const blocks = doc.body.querySelectorAll(BLOCK_SEL);
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.parentNode) b.parentNode.insertBefore(doc.createTextNode(" "), b.nextSibling);
  }
  return String(doc.body.textContent || "").replace(/\s+/g, " ").trim();
}

const PRIO_ORDER = { high:0, med:1, low:2 };
function sortTasks(list){
  return list.slice().sort((a,b) => {
    if (!!a.dueDate !== !!b.dueDate) return a.dueDate ? -1 : 1;
    if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    const pa = PRIO_ORDER.hasOwnProperty(a.priority) ? PRIO_ORDER[a.priority] : 3;
    const pb = PRIO_ORDER.hasOwnProperty(b.priority) ? PRIO_ORDER[b.priority] : 3;
    const p = pa - pb;
    if (p) return p;
    return ts(a.createdAt) - ts(b.createdAt);
  });
}

function uid(){
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

/* ------------------------------------------------------------- depolama */
const STORAGE_KEY = "taskhub";
const SCHEMA_VERSION = 1;
const NB_COLORS = ["#5b5bd6","#0b7a55","#c2410c","#b4309b","#0369a1","#a16207"];
const params = new URLSearchParams(location.search);

let storageOK = false;
let corruptRecovered = false;

function probeStorage(){
  if (params.get("nostorage") === "1") return false; // uyarı şeridini sınamak için
  try {
    const k = "__taskhub_probe__";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  } catch(e){ return false; }
}

function defaultState(){
  return {
    version: SCHEMA_VERSION,
    settings: { theme:"auto", lang:"tr", lastBackupAt:null, nagDismissedAt:null },
    tasks: []
  };
}

/** Dışarıdan gelen (veya eski) veriyi güvenli bir şekilde şemaya oturtur. */
function normalizeTask(raw){
  if (!raw || typeof raw !== "object") return null;
  const title = typeof raw.title === "string" ? raw.title : "";
  if (!title.trim() && !raw.id) return null;
  const now = new Date().toISOString();
  return {
    id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
    title: title,
    notes: typeof raw.notes === "string" ? raw.notes : "",
    dueDate: parseYmd(raw.dueDate) ? raw.dueDate : null,
    priority: ["low","med","high"].includes(raw.priority) ? raw.priority : "med",
    tags: Array.isArray(raw.tags) ? raw.tags.filter(x => typeof x === "string" && x.trim()).map(x => x.trim()).slice(0, 30) : [],
    subtasks: Array.isArray(raw.subtasks) ? raw.subtasks.map(s => ({
      id: (s && typeof s.id === "string" && s.id) ? s.id : uid(),
      title: (s && typeof s.title === "string") ? s.title : "",
      done: !!(s && s.done)
    })).filter(s => s.title.trim()) : [],
    done: !!raw.done,
    createdAt: ts(raw.createdAt) ? raw.createdAt : now,
    updatedAt: ts(raw.updatedAt) ? raw.updatedAt : (ts(raw.createdAt) ? raw.createdAt : now),
    completedAt: raw.done ? (ts(raw.completedAt) ? raw.completedAt : now) : null,
    sourceNoteId: (raw.sourceNoteId && typeof raw.sourceNoteId === "object"
      && typeof raw.sourceNoteId.notebookId === "string" && typeof raw.sourceNoteId.pageId === "string")
      ? { notebookId: raw.sourceNoteId.notebookId, pageId: raw.sourceNoteId.pageId } : null
  };
}

function normalizeState(raw){
  const s = defaultState();
  if (!raw || typeof raw !== "object") return s;
  const set = raw.settings || {};
  if (["auto","light","dark"].includes(set.theme)) s.settings.theme = set.theme;
  if (["tr","en"].includes(set.lang)) s.settings.lang = set.lang;
  if (ts(set.lastBackupAt)) s.settings.lastBackupAt = set.lastBackupAt;
  if (ts(set.nagDismissedAt)) s.settings.nagDismissedAt = set.nagDismissedAt;
  s.tasks = Array.isArray(raw.tasks) ? raw.tasks.map(normalizeTask).filter(Boolean) : [];
  return s;
}

/* ------------------------------------------------------------ notlar deposu
 * Notlar ayrı bir anahtarda tutulur. Tek anahtar olsaydı şişen bir not
 * setItem'ı patlatır ve GÖREVLER de kaydedilemez hale gelirdi; ayrı yazınca
 * notlar kotayı doldursa bile görev tarafı çalışmaya devam eder. */
const NOTES_KEY = "taskhub.notes";
const STORAGE_BUDGET = 5 * 1024 * 1024; // localStorage tavanı için pratik varsayım
let notesQuotaHit = false;

function defaultNotes(){ return { version: SCHEMA_VERSION, notebooks: [] }; }

function normalizeNotePage(raw){
  if (!raw || typeof raw !== "object") return null;
  const now = new Date().toISOString();
  return {
    id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
    title: typeof raw.title === "string" ? raw.title.slice(0, 300) : "",
    html: sanitizeHtml(typeof raw.html === "string" ? raw.html : ""),
    createdAt: ts(raw.createdAt) ? raw.createdAt : now,
    updatedAt: ts(raw.updatedAt) ? raw.updatedAt : (ts(raw.createdAt) ? raw.createdAt : now)
  };
}

function normalizeNotebook(raw){
  if (!raw || typeof raw !== "object") return null;
  const now = new Date().toISOString();
  return {
    id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
    name: typeof raw.name === "string" && raw.name.trim() ? raw.name.trim().slice(0, 120) : I18N.tr.untitledNotebook,
    color: /^#[0-9a-f]{6}$/i.test(raw.color) ? raw.color : NB_COLORS[0],
    pages: Array.isArray(raw.pages) ? raw.pages.map(normalizeNotePage).filter(Boolean) : [],
    createdAt: ts(raw.createdAt) ? raw.createdAt : now,
    updatedAt: ts(raw.updatedAt) ? raw.updatedAt : (ts(raw.createdAt) ? raw.createdAt : now)
  };
}

function normalizeNotes(raw){
  const n = defaultNotes();
  if (!raw || typeof raw !== "object") return n;
  n.notebooks = Array.isArray(raw.notebooks) ? raw.notebooks.map(normalizeNotebook).filter(Boolean) : [];
  return n;
}

function loadNotes(){
  if (!storageOK) return defaultNotes();
  let raw = null;
  try { raw = localStorage.getItem(NOTES_KEY); } catch(e){ return defaultNotes(); }
  if (!raw) return defaultNotes();
  try {
    return normalizeNotes(JSON.parse(raw));
  } catch(e){
    try { localStorage.setItem(NOTES_KEY + ".corrupt." + Date.now(), raw); } catch(_){}
    corruptRecovered = true;
    return defaultNotes();
  }
}

let notesSaveTimer = null;
function scheduleSaveNotes(){
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(saveNotesNow, 400);
}
function saveNotesNow(){
  clearTimeout(notesSaveTimer); notesSaveTimer = null;
  flushEditor();          // editördeki ham HTML süzgeçten geçip modele burada yazılır
  if (!storageOK) return;
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    notesQuotaHit = false;
  } catch(e){
    // storageOK'e dokunulmaz: görev kaydı bundan etkilenmemeli.
    notesQuotaHit = true;
    renderBanners();
    toast(t("notesQuotaFail"), null, 9000);
  }
}

/** İki anahtarın yaklaşık bayt boyutu (UTF-16 saklama varsayımıyla). */
function storageBytes(){
  let n = 0;
  try { n += JSON.stringify(state).length * 2; } catch(e){}
  try { n += JSON.stringify(notes).length * 2; } catch(e){}
  return n;
}
const storagePercent = () => Math.min(100, Math.round(storageBytes() / STORAGE_BUDGET * 100));
function formatBytes(n){
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

function load(){
  if (!storageOK) return defaultState();
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ return defaultState(); }
  if (!raw) return defaultState();
  try {
    return normalizeState(JSON.parse(raw));
  } catch(e){
    // Bozuk veriyi ezme — kenara al ki elle kurtarılabilsin.
    try { localStorage.setItem(STORAGE_KEY + ".corrupt." + Date.now(), raw); } catch(_){}
    corruptRecovered = true;
    return defaultState();
  }
}

let saveTimer = null;
function scheduleSave(){
  touchedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 300);
}
let touchedAt = null;
function saveNow(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!storageOK) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){
    storageOK = false;
    renderBanners();
    toast(t("quotaFail"));
  }
}
window.addEventListener("beforeunload", () => {
  if (saveTimer) saveNow();
  flushEditor();
  if (notesSaveTimer || dirtyEditor) saveNotesNow();
});

/* ------------------------------------------------------------- DOM yardımcısı */
function el(tag, props, ...children){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "svg") n.innerHTML = v;               // yalnızca sabit ICON değerleri
    else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  // Array.prototype.flat yerine elle düzleştirme — eski motorlarda da çalışsın.
  (function walk(items){
    for (let i = 0; i < items.length; i++){
      const c = items[i];
      if (c === null || c === undefined || c === false || c === "") continue;
      if (Array.isArray(c)){ walk(c); continue; }
      n.appendChild(c && c.nodeType ? c : document.createTextNode(String(c)));
    }
  })(children);
  return n;
}
const icon = (name, cls) => el("span", { class: cls || "", svg: ICON[name], "aria-hidden":"true" });

/* ------------------------------------------------------------------ toast */
function toast(msg, action, ms){
  const box = document.getElementById("toasts");
  if (!box) return;
  const node = el("div", { class:"toast", role:"status" }, el("span", { class:"grow", text: msg }));
  let timer = null;
  const kill = () => { clearTimeout(timer); node.remove(); };
  if (action){
    node.append(el("button", { class:"btn", onclick(){ kill(); action.run(); } }, action.label));
  }
  node.append(el("button", { class:"btn btn-ghost btn-icon", "aria-label": t("dismiss"), onclick: kill }, icon("x")));
  box.append(node);
  timer = setTimeout(kill, ms || 4500);
}

/* --------------------------------------------------------- görev işlemleri */
function stamp(task){ task.updatedAt = new Date().toISOString(); }
const getTask = id => state.tasks.find(x => x.id === id) || null;

function addTask(title){
  const now = new Date().toISOString();
  const task = {
    id: uid(), title: title.trim(), notes:"", dueDate:null, priority:"med",
    tags:[], subtasks:[], done:false, createdAt:now, updatedAt:now, completedAt:null
  };
  state.tasks.push(task);
  scheduleSave(); render();
  return task;
}

function toggleDone(id, done){
  const task = getTask(id); if (!task) return;
  task.done = done;
  task.completedAt = done ? new Date().toISOString() : null;
  stamp(task); scheduleSave(); render();
  // Paneli baştan çizmek yerine yerinde güncelle — aksi halde işaret kutusundaki odak kaybolur.
  if (openTaskId === id) syncPanelDone(task);
}

function syncPanelDone(task){
  const cb = document.getElementById("f-done");
  if (cb) cb.checked = task.done;
  const lbl = document.getElementById("f-done-label");
  if (lbl) lbl.textContent = task.done ? t("yes") : t("no");
  renderPanelMeta(task);
}

function deleteTask(id){
  const i = state.tasks.findIndex(x => x.id === id);
  if (i < 0) return;
  const [task] = state.tasks.splice(i, 1);
  if (openTaskId === id) closePanel();
  scheduleSave(); render();
  toast(t("deleted"), { label: t("undo"), run(){
    state.tasks.splice(Math.min(i, state.tasks.length), 0, task);
    scheduleSave(); render();
    toast(t("restored"));
  }}, 8000);
}

/* ---------------------------------------------------------------- filtreler */
const filtersActive = () => !!(ui.q.trim() || ui.status !== "all" || ui.prios.size || ui.tags.size);
function clearFilters(){
  ui.q = ""; ui.status = "all"; ui.prios.clear(); ui.tags.clear();
  const s = document.getElementById("q"); if (s) s.value = "";
  render();
}
function matches(task){
  if (ui.status === "active" && task.done) return false;
  if (ui.status === "done" && !task.done) return false;
  if (ui.prios.size && !ui.prios.has(task.priority)) return false;
  if (ui.tags.size && !task.tags.some(tg => ui.tags.has(tg))) return false;
  const q = foldTr(ui.q.trim());
  if (!q) return true;
  const hay = foldTr([task.title, task.notes, task.tags.join(" "), task.subtasks.map(s => s.title).join(" ")].join(" "));
  return q.split(/\s+/).every(term => hay.indexOf(term) !== -1);
}

/* ------------------------------------------------------------ tarih biçimi */
function formatDue(due){
  const d = daysBetween(today, due), dt = parseYmd(due);
  if (d === null || !dt) return { text:"", cls:"" };
  if (d === 0) return { text: t("today"), cls:"due-today" };
  if (d === 1) return { text: t("tomorrow"), cls:"" };
  if (d === -1) return { text: t("yesterday"), cls:"due-over" };
  const full = new Intl.DateTimeFormat(LOCALE(), { day:"2-digit", month:"2-digit", year:"numeric" }).format(dt);
  if (d < 0) return { text: full, cls:"due-over" };
  if (d <= 7) return { text: new Intl.DateTimeFormat(LOCALE(), { weekday:"long" }).format(dt), cls:"" };
  return { text: full, cls:"" };
}
function formatStamp(iso){
  if (!ts(iso)) return "";
  return new Intl.DateTimeFormat(LOCALE(), { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }).format(new Date(iso));
}

/* ---------------------------------------------------------------- şeritler */
function renderBanners(){
  const box = document.getElementById("banners");
  if (!box) return;
  box.textContent = "";

  if (!storageOK){
    box.append(el("div", { class:"banner danger", role:"alert" },
      el("span", { svg:ICON.warn, "aria-hidden":"true" }),
      el("span", { class:"grow" }, el("strong", { text: t("storageFailTitle") }), " ", t("storageFailText")),
      el("button", { class:"btn", onclick: exportJson }, t("backupNow"))
    ));
  }
  if (notesQuotaHit){
    box.append(el("div", { class:"banner danger", role:"alert" },
      el("span", { svg:ICON.warn, "aria-hidden":"true" }),
      el("span", { class:"grow", text: t("notesQuotaFail") }),
      el("button", { class:"btn", onclick: exportJson }, t("backupNow"))
    ));
  }
  if (storageOK && !notesQuotaHit && storagePercent() >= 80){
    box.append(el("div", { class:"banner warn" },
      el("span", { svg:ICON.info, "aria-hidden":"true" }),
      el("span", { class:"grow", text: t("storageWarn", { n: storagePercent() }) }),
      el("button", { class:"btn", onclick: exportJson }, t("backupNow"))
    ));
  }
  if (corruptRecovered){
    box.append(el("div", { class:"banner warn", role:"alert" },
      el("span", { svg:ICON.warn, "aria-hidden":"true" }),
      el("span", { class:"grow", text: t("corrupt") }),
      el("button", { class:"btn", onclick(){ corruptRecovered = false; renderBanners(); } }, t("dismiss"))
    ));
  }

  // Yedek hatırlatması: 14 günden eski (veya hiç yedeklenmemiş, en az 14 günlük görev varsa)
  if (storageOK && !ui.nagHidden && state.tasks.length){
    const ref = state.settings.lastBackupAt || state.settings.nagDismissedAt
      || state.tasks.reduce((min, x) => Math.min(min, ts(x.createdAt) || Infinity), Infinity);
    const base = typeof ref === "string" ? ts(ref) : ref;
    if (base && base !== Infinity){
      const days = Math.floor((Date.now() - base) / 86400000);
      if (days >= 14){
        box.append(el("div", { class:"banner warn" },
          el("span", { svg:ICON.info, "aria-hidden":"true" }),
          el("span", { class:"grow", text: t("backupNag", { n: days }) }),
          el("button", { class:"btn", onclick: exportJson }, t("backupNow")),
          el("button", { class:"btn btn-ghost", onclick(){
            ui.nagHidden = true;
            state.settings.nagDismissedAt = new Date().toISOString();
            scheduleSave(); renderBanners();
          }}, t("dismiss"))
        ));
      }
    }
  }

  if (filtersActive()){
    box.append(el("div", { class:"banner" },
      el("span", { svg:ICON.filter, "aria-hidden":"true" }),
      el("span", { class:"grow", text: t("filterOn") }),
      el("button", { class:"btn", onclick: clearFilters }, t("clearFilters"))
    ));
  }
}

function renderSidebar(){
  const bar = document.getElementById("sidebar");
  if (!bar) return;
  bar.textContent = "";

  const statusCounts = {
    all: state.tasks.length,
    active: state.tasks.filter(x => !x.done).length,
    done: state.tasks.filter(x => x.done).length
  };
  const statusGroup = el("div", { class:"side-group" }, el("h2", { class:"side-title", text: t("status") }));
  const statusList = el("ul", { class:"side-list" });
  for (const key of ["all","active","done"]){
    statusList.append(el("li", {}, el("button", {
      class:"side-item", "aria-pressed": String(ui.status === key),
      onclick(){ ui.status = key; render(); }
    }, el("span", { text: t(key) }), el("span", { class:"count", text: String(statusCounts[key]) }))));
  }
  statusGroup.append(statusList);

  const prioGroup = el("div", { class:"side-group" }, el("h2", { class:"side-title", text: t("priority") }));
  const prioList = el("ul", { class:"side-list" });
  for (const p of ["high","med","low"]){
    const n = state.tasks.filter(x => x.priority === p).length;
    prioList.append(el("li", {}, el("button", {
      class:"side-item", "aria-pressed": String(ui.prios.has(p)),
      onclick(){ ui.prios.has(p) ? ui.prios.delete(p) : ui.prios.add(p); render(); }
    }, el("span", { class:"dot " + p }), el("span", { text: t(p) }), el("span", { class:"count", text:String(n) }))));
  }
  prioGroup.append(prioList);

  const counts = new Map();
  for (const task of state.tasks) for (const tg of task.tags) counts.set(tg, (counts.get(tg) || 0) + 1);
  const tagNames = [...counts.keys()].sort((a,b) => a.localeCompare(b, LOCALE()));
  const tagGroup = el("div", { class:"side-group" }, el("h2", { class:"side-title", text: t("tags") }));
  if (!tagNames.length){
    tagGroup.append(el("p", { class:"side-item", style:"cursor:default", text: t("noTags") }));
  } else {
    const tagList = el("ul", { class:"side-list" });
    for (const tg of tagNames){
      tagList.append(el("li", {}, el("button", {
        class:"side-item", "aria-pressed": String(ui.tags.has(tg)),
        onclick(){ ui.tags.has(tg) ? ui.tags.delete(tg) : ui.tags.add(tg); render(); }
      }, el("span", { text: "#" + tg }), el("span", { class:"count", text:String(counts.get(tg)) }))));
    }
    tagGroup.append(tagList);
  }

  bar.append(statusGroup, prioGroup, tagGroup);
}

/* ------------------------------------------------------------------ liste */
function taskCard(task){
  const cls = ["card"];
  if (task.done) cls.push("is-done");
  if (task.id === openTaskId) cls.push("selected");

  const cb = el("input", {
    type:"checkbox", class:"check", checked: task.done,
    "aria-label": task.title || t("titleLbl"),
    onclick(e){ e.stopPropagation(); },
    onchange(e){ toggleDone(task.id, e.target.checked); }
  });

  const meta = el("div", { class:"card-meta" });
  if (task.dueDate){
    const f = formatDue(task.dueDate);
    meta.append(el("span", { class:"m " + f.cls }, icon("cal"), el("span", { text:f.text })));
  }
  // "Orta" varsayılan olduğu için yalnızca ondan sapan öncelik gösterilir.
  if (!task.done && task.priority !== "med"){
    meta.append(el("span", { class:"m m-prio " + task.priority },
      el("span", { class:"dot " + task.priority }), el("span", { text: t(task.priority) })));
  }
  if (task.subtasks.length){
    const doneN = task.subtasks.filter(s => s.done).length;
    meta.append(el("span", { class:"m" },
      el("span", { class:"progress" }, el("i", { style:"width:" + Math.round(doneN / task.subtasks.length * 100) + "%" })),
      el("span", { text: doneN + "/" + task.subtasks.length })
    ));
  }
  for (const tg of task.tags) meta.append(el("span", { class:"chip", text:"#" + tg }));

  const card = el("li", { class: cls.join(" "), tabindex:"0", role:"button",
    "aria-label": task.title,
    onclick(){ openPanel(task.id, card); },
    onkeydown(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openPanel(task.id, card); } }
  },
    el("span", { class:"prio-bar " + (task.done ? "" : task.priority), "aria-hidden":"true" }),
    cb,
    el("div", { class:"card-body" },
      el("div", { class:"card-title", text: task.title || "—" }),
      meta.childNodes.length ? meta : null
    ),
    el("button", { class:"btn btn-ghost btn-icon card-del", title: t("deleteTask"), "aria-label": t("deleteTask"),
      onclick(e){ e.stopPropagation(); deleteTask(task.id); } }, icon("trash"))
  );
  return card;
}

function renderList(){
  const box = document.getElementById("list");
  if (!box) return;
  box.textContent = "";

  const visible = state.tasks.filter(matches);
  if (!visible.length){
    const filtered = filtersActive();
    box.append(el("div", { class:"empty" },
      el("span", { svg:ICON.inbox, "aria-hidden":"true" }),
      el("h2", { text: filtered ? t("emptyFilterTitle") : t("emptyTitle") }),
      el("p", { text: filtered ? t("emptyFilterText") : t("emptyText") })
    ));
    return;
  }

  const groups = new Map(BUCKETS.map(b => [b, []]));
  for (const task of visible) groups.get(bucketOf(task, today)).push(task);

  for (const key of BUCKETS){
    const items = sortTasks(groups.get(key));
    if (!items.length) continue;

    const isCompleted = key === "completed";
    const expanded = isCompleted ? ui.showCompleted : true;
    const head = el("h2", { class:"group-head" + (key === "overdue" ? " overdue" : "") });
    if (isCompleted){
      head.append(el("button", {
        class:"group-toggle", "aria-expanded": String(expanded), "aria-controls":"g-" + key,
        onclick(){ ui.showCompleted = !ui.showCompleted; renderList(); }
      }, icon("chev"), el("span", { text: t("b_" + key) }), el("span", { class:"n", text:String(items.length) })));
    } else {
      head.append(el("span", { text: t("b_" + key) }), el("span", { class:"n", text:String(items.length) }));
    }

    const list = el("ul", { class:"tasklist", id:"g-" + key });
    if (expanded) for (const task of items) list.append(taskCard(task));
    box.append(el("section", { class:"group" }, head, list));
  }
}
